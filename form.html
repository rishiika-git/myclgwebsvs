<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Details Form</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f3f9ff, #e1f5fe);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    form {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.15);
      width: 400px;
    }

    h1 {
      text-align: center;
      color: #1565c0;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #42a5f5;
      outline: none;
      box-shadow: 0px 0px 6px rgba(66,165,245,0.5);
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #42a5f5, #1e88e5);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #1e88e5, #1565c0);
      transform: scale(1.03);
      box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <form action="thankyou.html" method="post">
    <h1>College Details Form</h1>

    <label for="College">College Name:</label>
    <input type="text" id="College" name="CollegeName" required>

    <label for="Course">Course:</label>
    <input type="text" id="Course" name="Course" required>

    <label for="RollNo">Roll No:</label>
    <input type="number" id="RollNo" name="RollNo" required>

    <label for="Name">Name:</label>
    <input type="text" id="Name" name="Name" required>

    <label for="DOB">Date of Birth:</label>
    <input type="date" id="DOB" name="DOB" required>

    <label for="Address">Address:</label>
    <textarea id="Address" name="Address" rows="3" required></textarea>

    <label for="GraduationYear">Select Year of Graduation:</label>
    <select id="GraduationYear" name="Year" required>
      <option>2026</option>
      <option>2027</option>
      <option>2028</option>
      <option>2029</option>
      <option>2030</option>
    </select>

    <label for="Email">Enter Email:</label>
    <input type="email" id="Email" name="Email" required>

    <label for="Phone">Phone Number:</label>
    <input type="tel" id="Phone" name="Phnnum" required>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
