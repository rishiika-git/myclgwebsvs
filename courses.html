<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Courses</title>
  <style>
    body {
      font-family: serif;
      padding: 20px;
      color: #000;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      width: 180px;
      height: 120px;
      background-color: #d1e7dd;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 10px;
    }

    .card h3 {
      margin: 0;
      font-size: 18px;
    }

    .card p {
      margin: 0;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>
<body>
  <h2>my courses</h2>
  <h2>frontend</h2>
  <div class="container">
    <div class="card">
      <h3>html</h3>
      <p>learn html basics</p>
    </div>
    <div class="card">
      <h3>css</h3>
      <p>learn css basics</p>
    </div>
    <div class="card">
      <h3>python</h3>
      <p>learn python basics</p>
    </div>
  </div>

  <!-- Backend Section -->
  <h2>backend</h2>
  <div class="container">
    <div class="card">
      <h3>java</h3>
      <p>learn java basics</p>
    </div>
    <div class="card">
      <h3>python</h3>
      <p>learn python backend</p>
    </div>
    <div class="card">
      <h3>ML</h3>
      <p>learn machine learning</p>
    </div>
  </div>

  <!-- Database Section -->
  <h2>database</h2>
  <div class="container">
    <div class="card">
      <h3>SQL</h3>
      <p>learn SQL queries</p>
    </div>
    <div class="card">
      <h3>MongoDB</h3>
      <p>learn NoSQL basics</p>
    </div>
    <div class="card">
      <h3>PostgreSQL</h3>
      <p>learn relational DB</p>
    </div>
  </div>

</body>
</html>
